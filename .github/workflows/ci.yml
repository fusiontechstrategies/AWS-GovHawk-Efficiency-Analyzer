name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify dependency installation
        run: python -m pip check

      - name: Lint
        run: ruff check AWS_GovCloud_Analyzer.py scripts tests

      - name: Check formatting
        run: ruff format --check AWS_GovCloud_Analyzer.py scripts tests

      - name: Unit tests
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m unittest discover -s tests -v

      - name: Type check
        run: mypy AWS_GovCloud_Analyzer.py

      - name: Security lint
        run: bandit -q -r AWS_GovCloud_Analyzer.py scripts

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt

  release-artifact:
    name: Release artifact Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Resolve reproducible build epoch
        id: build-epoch
        shell: bash
        run: echo "value=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build exact candidate twice
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build-epoch.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_release.py \
            --version 2.0.0 \
            --tag v2.0.0 \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output-directory release-candidate
          python scripts/prepare_release.py \
            --version 2.0.0 \
            --tag v2.0.0 \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output-directory repeat-release-candidate
          test "$(find release-candidate -maxdepth 1 -type f -printf '%f\n' | sort)" = \
            "$(find repeat-release-candidate -maxdepth 1 -type f -printf '%f\n' | sort)"
          for artifact in release-candidate/*; do
            cmp --silent "$artifact" "repeat-release-candidate/${artifact##*/}"
          done
          test "$(find release-candidate -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Exercise the exact standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          python release-candidate/AWS-GovHawk-Efficiency-Analyzer-v2.0.0.py --version
          python release-candidate/AWS-GovHawk-Efficiency-Analyzer-v2.0.0.py --help >/dev/null
          python release-candidate/AWS-GovHawk-Efficiency-Analyzer-v2.0.0.py --list-services >/dev/null

      - name: Preserve the exact release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-govhawk-v2.0.0-candidate-${{ github.sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30
