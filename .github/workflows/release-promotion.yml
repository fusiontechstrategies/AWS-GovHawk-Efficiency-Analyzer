name: Promote verified release candidate

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-promotion-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.identity.outputs.artifact-id }}
      verifier-commit: ${{ steps.identity.outputs.verifier-commit }}
      source-commit: ${{ steps.identity.outputs.source-commit }}
      epoch: ${{ steps.identity.outputs.epoch }}
      version: ${{ steps.subjects.outputs.version }}
      tag: ${{ steps.subjects.outputs.tag }}
      manifest: ${{ steps.subjects.outputs.manifest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      VERIFIER_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out default-branch workflow verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: verifier
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Bind authenticated run, source and independent verifier
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$VERIFIER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GH_REPO" --jq .default_branch)" = main
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .protected)" = true
          test "$(gh api "repos/$GH_REPO/commits/$VERIFIER_COMMIT" --jq .commit.verification.verified)" = true
          test "$(gh api "repos/$GH_REPO/commits/$SOURCE_COMMIT" --jq .commit.verification.verified)" = true
          git -C verifier merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          git -C verifier merge-base --is-ancestor "$VERIFIER_COMMIT" origin/main
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > source-artifacts.json
          python -I - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['path'] == '.github/workflows/release.yml'
          assert run['event'] == 'push' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_COMMIT']
          assert run['head_repository']['full_name'] == os.environ['GH_REPO']
          pages = json.load(open('source-artifacts.json'))
          assert isinstance(pages, list) and pages
          candidates = [x for page in pages for x in page['artifacts'] if x['name'] == 'release-assets' and not x['expired']]
          assert len(candidates) == 1
          assert isinstance(candidates[0]['id'], int) and candidates[0]['id'] > 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('artifact-id=' + str(candidates[0]['id']), file=out)
              print('verifier-commit=' + os.environ['VERIFIER_COMMIT'], file=out)
              print('source-commit=' + os.environ['SOURCE_COMMIT'], file=out)
          PY
          echo "epoch=$(git -C verifier show -s --format=%ct "$SOURCE_COMMIT")" >> "$GITHUB_OUTPUT"
      - name: Check out authenticated source strictly as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          path: source-data
          fetch-depth: 0
          persist-credentials: false
      - name: Pin authenticated source data from independently checked main history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-data rev-parse HEAD)" = "$VERIFIER_COMMIT"
          git -C source-data merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git -C source-data checkout --detach "$SOURCE_COMMIT"
          test "$(git -C source-data rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Download only the authenticated run's immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.identity.outputs.artifact-id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          path: release-assets
      - name: Derive exact verified subjects without executing tagged code
        id: subjects
        env:
          SOURCE_EPOCH: ${{ steps.identity.outputs.epoch }}
        shell: bash
        run: |
          set -euo pipefail
          python -I verifier/scripts/verify_release_handoff.py release-assets source-data "$SOURCE_COMMIT" "$SOURCE_EPOCH" > subjects.json
          python -I - <<'PY'
          import json, os
          subjects = json.load(open('subjects.json'))
          assert json.load(open('source-run.json'))['head_branch'] == subjects['tag']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('tag', 'version'):
                  print(name + '=' + subjects[name], file=out)
              print('manifest=' + json.dumps(subjects['manifest'], sort_keys=True, separators=(',', ':')), file=out)
          PY
          tag="$(python -I -c 'import json; print(json.load(open("subjects.json"))["tag"])')"
          python -I verifier/scripts/verify_release_integrity.py tag "$GH_REPO" "$tag" "$SOURCE_COMMIT"

  attest:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out independently trusted verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.verifier-commit }}
          path: verifier
          persist-credentials: false
      - name: Check out authenticated tagged source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source-commit }}
          path: source-data
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Download the bound immutable producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          path: release-assets
      - name: Reconstruct and verify exact subjects with protected code
        env:
          SOURCE_COMMIT: ${{ needs.verify.outputs.source-commit }}
          SOURCE_EPOCH: ${{ needs.verify.outputs.epoch }}
          EXPECTED_MANIFEST: ${{ needs.verify.outputs.manifest }}
        run: python -I verifier/scripts/verify_release_handoff.py release-assets source-data "$SOURCE_COMMIT" "$SOURCE_EPOCH" --expected-manifest "$EXPECTED_MANIFEST"
      - name: Attest only the independently reconstructed subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-assets/*

  draft:
    needs: [verify, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out independently trusted verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.verifier-commit }}
          path: verifier
          persist-credentials: false
      - name: Check out authenticated tagged source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source-commit }}
          path: source-data
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Download the bound immutable producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          path: release-assets
      - name: Reconstruct and verify exact subjects with protected code
        env:
          SOURCE_COMMIT: ${{ needs.verify.outputs.source-commit }}
          SOURCE_EPOCH: ${{ needs.verify.outputs.epoch }}
          EXPECTED_MANIFEST: ${{ needs.verify.outputs.manifest }}
        run: python -I verifier/scripts/verify_release_handoff.py release-assets source-data "$SOURCE_COMMIT" "$SOURCE_EPOCH" --expected-manifest "$EXPECTED_MANIFEST"
      - name: Create draft and verify every remote subject
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source-commit }}
          EXPECTED_MANIFEST: ${{ needs.verify.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          python -I verifier/scripts/verify_release_integrity.py tag "$GH_REPO" "$RELEASE_TAG" "$SOURCE_COMMIT"
          created_id=""
          cleanup_failed_new_draft() {
            status=$?
            if [[ "$status" -ne 0 && "$created_id" =~ ^[0-9]+$ ]]; then
              if gh api "repos/$GH_REPO/releases/$created_id" > failed-draft.json 2>/dev/null; then
                if CREATED_ID="$created_id" python -I -c 'import json, os; state = json.load(open("failed-draft.json")); assert state["id"] == int(os.environ["CREATED_ID"]) and state["draft"] is True; assert state["tag_name"] == os.environ["RELEASE_TAG"]; assert state["target_commitish"] == os.environ["SOURCE_COMMIT"]'; then
                  gh api --method DELETE "repos/$GH_REPO/releases/$created_id" >/dev/null || true
                fi
              fi
            fi
            return "$status"
          }
          trap cleanup_failed_new_draft EXIT
          RELEASE_TITLE="AWS GovHawk Efficiency Analyzer" python -I - <<'PY' > draft-request.json
          import json, os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          print(json.dumps({'tag_name': tag, 'target_commitish': os.environ['SOURCE_COMMIT'],
                            'name': os.environ['RELEASE_TITLE'] + ' ' + tag,
                            'body': Path('source-data/.github/release-notes/' + tag + '.md').read_text(),
                            'draft': True, 'prerelease': False}))
          PY
          gh api --method POST "repos/$GH_REPO/releases" --input draft-request.json > draft-created.json
          created_id="$(python -I -c 'import json; value=json.load(open("draft-created.json")); assert isinstance(value["id"], int) and value["id"] > 0 and value["draft"] is True; print(value["id"])')"
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" release-assets/*
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json databaseId,isDraft,isPrerelease,assets > release-state.json
          python -I - <<'PY'
          import json, os
          state = json.load(open('release-state.json'))
          assert state['databaseId'] == json.load(open('draft-created.json'))['id']
          assert state['isDraft'] is True and state['isPrerelease'] is False
          assert {x['name'] for x in state['assets']} == set(json.loads(os.environ['EXPECTED_MANIFEST']))
          PY
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir readback
          python -I verifier/scripts/verify_release_integrity.py assets readback "$EXPECTED_MANIFEST"
          python -I verifier/scripts/verify_release_integrity.py tag "$GH_REPO" "$RELEASE_TAG" "$SOURCE_COMMIT"
