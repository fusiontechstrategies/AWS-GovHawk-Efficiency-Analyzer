name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      manifest: ${{ steps.final.outputs.manifest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve and validate release identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must contain a stable semantic version" >&2
            exit 1
          fi
          release_commit="$(git rev-list --max-count=1 "$GITHUB_REF_NAME")"
          test "$release_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_commit" --jq '.commit.verification.verified')"
          test "$verified" = "true"
          test -f ".github/release-notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          python -I scripts/verify_release_integrity.py source "$release_commit"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct "$release_commit")" >> "$GITHUB_OUTPUT"

      - name: Install exact runtime dependencies
        run: python -I -m pip install --disable-pip-version-check --require-hashes -r requirements-release-lock.txt

      - name: Build exact release assets twice
        id: assets
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.epoch }}
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/verify_release_integrity.py source "$RELEASE_COMMIT"
          python -I scripts/prepare_release.py \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output-directory release-assets
          python -I scripts/prepare_release.py \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output-directory repeat-release-assets
          test "$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)" = \
            "$(find repeat-release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          for artifact in release-assets/*; do
            cmp --silent "$artifact" "repeat-release-assets/${artifact##*/}"
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 5
          expected="$(python -I scripts/verify_release_integrity.py assets release-assets -)"
          echo "manifest=$expected" >> "$GITHUB_OUTPUT"

      - name: Revalidate source and exact final bytes
        id: final
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          EXPECTED_MANIFEST: ${{ steps.assets.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/verify_release_integrity.py source "$RELEASE_COMMIT"
          python -I scripts/verify_release_integrity.py assets repeat-release-assets "$EXPECTED_MANIFEST"
          python -I scripts/verify_release_integrity.py assets release-assets "$EXPECTED_MANIFEST"
          echo "manifest=$EXPECTED_MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Preserve the exact release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke-test immutable assets on an isolated consumer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Download immutable producer handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets
          merge-multiple: true
      - name: Verify producer bytes before consumer tooling
        env:
          EXPECTED_MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          python -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('release-assets')
          expected = json.loads(os.environ['EXPECTED_MANIFEST'])
          assert {p.name for p in root.iterdir()} == set(expected)
          for name, digest in expected.items():
              path = root / name
              assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          PY

      - name: Install isolated runtime test sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Capture system boundaries before a selected wheel can install scripts.
          python -I - <<'PY'
          import hashlib, os, stat, sys
          from pathlib import Path
          launcher = Path('/usr/bin/bwrap')
          info = launcher.lstat()
          assert stat.S_ISREG(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022
          interpreter = Path(sys.executable).resolve(strict=True)
          assert interpreter.is_absolute()
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              print('SMOKE_SANDBOX_PATH=' + str(launcher), file=out)
              print('SMOKE_SANDBOX_SHA256=' + hashlib.sha256(launcher.read_bytes()).hexdigest(), file=out)
              print('SMOKE_BASE_PYTHON=' + str(interpreter), file=out)
          PY

      - name: Obtain the exact signed source dependency lock as data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/contents/requirements-release-lock.txt?ref=$SOURCE_COMMIT" > source-lock.json
          python -I - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          record = json.loads(Path('source-lock.json').read_text())
          assert record['encoding'] == 'base64' and 0 < record['size'] <= 256 * 1024
          encoded = ''.join(record['content'].split())
          assert len(encoded) <= 350 * 1024
          value = base64.b64decode(encoded, validate=True)
          assert len(value) == record['size']
          # Git's blob object name binds the returned bytes, not a credential hash.
          blob = b'blob ' + str(len(value)).encode() + b'\0' + value
          assert hashlib.sha1(blob, usedforsecurity=False).hexdigest() == record['sha']
          Path('runtime-lock.txt').write_bytes(value)
          PY

      - name: Install exact hash-locked smoke runtime dependencies
        run: |
          "$SMOKE_BASE_PYTHON" -I -m venv "$PWD/smoke-runtime"
          # Download wheels as data outside isolation. Installing their .pth files,
          # entry points or compile helpers runs only inside the captured sandbox.
          "$SMOKE_BASE_PYTHON" -I -m pip download --disable-pip-version-check --only-binary=:all: --no-deps --require-hashes -r runtime-lock.txt --dest "$PWD/smoke-wheels"
          "$SMOKE_BASE_PYTHON" -I - <<'PY'
          import hashlib, os, stat
          from pathlib import Path
          launcher = Path(os.environ['SMOKE_SANDBOX_PATH'])
          assert str(launcher) == '/usr/bin/bwrap'
          info = launcher.lstat()
          assert stat.S_ISREG(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022
          assert hashlib.sha256(launcher.read_bytes()).hexdigest() == os.environ['SMOKE_SANDBOX_SHA256']
          PY
          "$SMOKE_SANDBOX_PATH" --unshare-all --die-with-parent --new-session --clearenv \
            --setenv HOME /tmp --setenv PATH /usr/bin:/bin \
            --ro-bind / / --bind "$PWD/smoke-runtime" "$PWD/smoke-runtime" \
            --proc /proc --dev /dev --tmpfs /tmp --chdir "$PWD" \
            "$PWD/smoke-runtime/bin/python" -I -m pip install --no-index --no-cache-dir \
            --find-links "$PWD/smoke-wheels" --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r runtime-lock.txt

      - name: Exercise the exact standalone runtime
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke-assets
          cp release-assets/*.py smoke-assets/
          # The base interpreter was captured before installation and has no
          # selected runtime wheels or .pth files. Recheck the exact system tool.
          "$SMOKE_BASE_PYTHON" -I - <<'PY'
          import hashlib, os, stat
          from pathlib import Path
          launcher = Path(os.environ['SMOKE_SANDBOX_PATH'])
          assert str(launcher) == '/usr/bin/bwrap'
          info = launcher.lstat()
          assert stat.S_ISREG(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022
          assert hashlib.sha256(launcher.read_bytes()).hexdigest() == os.environ['SMOKE_SANDBOX_SHA256']
          PY
          python_path="$PWD/smoke-runtime/bin/python"
          candidate="$PWD/smoke-assets/AWS-GovHawk-Efficiency-Analyzer-v$RELEASE_VERSION.py"
          # Read-only host mounts and isolated process/network namespaces prevent
          # candidate execution from changing the verifier or release artifacts.
          sandbox=("$SMOKE_SANDBOX_PATH" --unshare-all --die-with-parent --new-session --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp --chdir /tmp)
          test "$("${sandbox[@]}" "$python_path" -I "$candidate" --version)" = \
            "GovHawk $RELEASE_VERSION"
          "${sandbox[@]}" "$python_path" -I "$candidate" --help >/dev/null
          "${sandbox[@]}" "$python_path" -I "$candidate" --list-services >/dev/null

